<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>학교장추천 전형 수요조사 · 교사 확인용</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B3E86; --navy2:#092f66; --gold:#F5B301; --gold-d:#c8920a;
  --green:#1A9A3E; --ink:#141a24; --soft:#3d4652; --line:#b9c4d4; --lt:#eef3fa;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:#f3efe6;
  word-break:keep-all; line-height:1.5; }

/* ── 로그인 게이트 ── */
.gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.gbox{ background:#fff; border:3px solid var(--navy2); box-shadow:8px 8px 0 var(--gold);
  width:100%; max-width:380px; overflow:hidden; }
.gbox .ghd{ background:var(--navy); color:#fff; padding:24px 24px 20px; border-bottom:4px solid var(--gold); }
.gbox .ghd .sc{ font-size:12px; font-weight:800; color:#cfe0f7; letter-spacing:.06em; }
.gbox .ghd h1{ font-size:19px; font-weight:900; margin-top:6px; letter-spacing:-.02em; }
.gbox .gbd{ padding:22px 24px 26px; }
.gbox label{ font-size:13px; font-weight:800; color:var(--navy2); display:block; margin-bottom:7px; }
.gbox input{ width:100%; padding:13px 14px; font-size:16px; font-family:inherit;
  border:2.5px solid #cfc7b2; }
.gbox input:focus{ outline:none; border-color:var(--navy); }
.gbox button{ width:100%; margin-top:13px; padding:13px; font-size:15.5px; font-weight:900;
  font-family:inherit; color:#fff; background:var(--navy);
  border:2.5px solid var(--navy2); box-shadow:3px 3px 0 rgba(9,47,102,.45); cursor:pointer; }
.gbox button:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(9,47,102,.45); }
.gerr{ display:none; margin-top:10px; font-size:13px; font-weight:700; color:#c0392b; }

/* ── 대시보드 ── */
.dash{ display:none; max-width:1180px; margin:0 auto; padding:0 16px 40px; }
.dtop{ background:var(--navy); color:#fff; margin:0 -16px; padding:22px 24px 18px; }
.dtop .in{ max-width:1148px; margin:0 auto; display:flex; align-items:flex-end;
  justify-content:space-between; gap:14px; flex-wrap:wrap; }
.dtop .sc{ font-size:12px; font-weight:800; color:#cfe0f7; letter-spacing:.06em; }
.dtop h1{ font-size:21px; font-weight:900; letter-spacing:-.02em; margin-top:5px; }
.dtop .acts{ display:flex; gap:8px; flex-wrap:wrap; }
.dtop .acts button{ padding:9px 14px; font-size:13px; font-weight:800; font-family:inherit;
  border:2px solid rgba(255,255,255,.55); background:transparent; color:#fff; cursor:pointer; }
.dtop .acts button:hover{ background:rgba(255,255,255,.12); }
.goldline{ height:6px; background:var(--gold); margin:0 -16px; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px; }
.stat{ background:#fff; border:2.5px solid var(--navy2); padding:14px 18px; box-shadow:4px 4px 0 rgba(9,47,102,.9); }
.stat .lb{ font-size:12px; font-weight:800; color:var(--green); letter-spacing:.04em; }
.stat .v{ font-size:26px; font-weight:900; color:var(--navy); margin-top:2px; }
.stat .v small{ font-size:13px; color:var(--soft); font-weight:700; }

/* ── 보기 전환 탭 ── */
.tabs{ display:flex; gap:0; margin-top:22px; border-bottom:3px solid var(--navy2); }
.tabs button{ padding:11px 22px; font-size:15px; font-weight:900; font-family:inherit;
  border:2.5px solid #b3aa90; border-bottom:none; background:#efe9da; color:var(--soft);
  cursor:pointer; margin-right:6px; }
.tabs button.on{ background:var(--navy); border-color:var(--navy2); color:#fff; }

.fbar{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.fbar button{ padding:7px 15px; font-size:13.5px; font-weight:800; font-family:inherit;
  border:2px solid #b3aa90; background:#fff; color:var(--soft); cursor:pointer; }
.fbar button.on{ background:var(--navy); border-color:var(--navy2); color:#fff; box-shadow:2px 2px 0 rgba(9,47,102,.45); }

.card{ background:#fff; border:2.5px solid var(--navy2); margin-top:18px; overflow:hidden; box-shadow:4px 4px 0 rgba(9,47,102,.9); }
.card .chd{ display:flex; align-items:center; gap:9px; padding:12px 16px;
  background:var(--navy); border-bottom:2.5px solid var(--navy2); }
.card .chd .tt{ font-size:15px; font-weight:900; color:#fff; }
.card .chd .tt::before{ content:""; display:inline-block; width:12px; height:12px;
  background:var(--gold); margin-right:8px; vertical-align:-1px; }
.card .chd .n{ margin-left:auto; font-size:12.5px; font-weight:700; color:#cfe0f7; white-space:nowrap; }
.tscroll{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; min-width:640px; }
th{ background:var(--navy2); color:#fff; font-size:12.5px; font-weight:700;
  padding:9px 12px; text-align:left; white-space:nowrap; }
td{ padding:9px 12px; font-size:13.5px; border-top:1px solid #e8e4d8; vertical-align:top; }
.ts{ font-size:12px; color:var(--soft); white-space:nowrap; }
.stname{ font-weight:900; color:var(--navy2); white-space:nowrap; }
.stnum{ font-size:12px; color:var(--soft); white-space:nowrap; }
.uline{ display:block; margin-top:2px; }
.uline:first-child{ margin-top:0; }
.uline b{ color:var(--navy); }
.tagnone{ display:inline-block; font-size:11.5px; font-weight:800; color:#8a5a00;
  border:2px solid var(--gold-d); padding:1px 7px; }
.misslist{ padding:13px 16px; font-size:13.5px; }
.misslist b{ color:var(--navy); }
.misslist .nm{ display:inline-block; border:2px solid #c0392b; color:#a33025; font-weight:800;
  padding:2px 9px; margin:3px 4px 0 0; font-size:13px; }
.empty{ margin-top:18px; border:2.5px dashed var(--gold-d); background:#fff;
  padding:14px 16px; font-size:13.5px; color:var(--soft); }

.foot{ text-align:center; font-size:12.5px; font-weight:800; color:var(--navy); padding:26px 0 0; }
@media (max-width:760px){ .stats{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gbox">
    <div class="ghd">
      <div class="sc">호남고등학교 3학년부 · 교사 전용</div>
      <h1>학교장추천 전형 수요조사<br>제출 현황 확인</h1>
    </div>
    <div class="gbd">
      <label for="gpw">확인용 비밀번호</label>
      <input type="password" id="gpw" placeholder="비밀번호 입력" autocomplete="off">
      <div class="gerr" id="gerr">비밀번호가 올바르지 않습니다.</div>
      <button id="gbtn">확인</button>
    </div>
  </div>
</div>

<div class="dash" id="dash">
  <div class="dtop"><div class="in">
    <div>
      <div class="sc">호남고등학교 3학년부 · 교사 전용</div>
      <h1>2027 대입 학교장추천 전형 수요조사 — 제출 현황</h1>
    </div>
    <div class="acts">
      <button id="copyBtn">표 복사 (한글·엑셀 붙여넣기)</button>
      <button id="csvBtn">CSV 다운로드</button>
      <button id="live" style="cursor:default">연결 중…</button>
    </div>
  </div></div>
  <div class="goldline"></div>

  <div class="stats">
    <div class="stat"><div class="lb">전체 학생</div><div class="v" id="stTotal">-<small> 명</small></div></div>
    <div class="stat"><div class="lb">지원 계획 제출</div><div class="v" id="stApply">-<small> 명</small></div></div>
    <div class="stat"><div class="lb">지원 계획 없음</div><div class="v" id="stNone">-<small> 명</small></div></div>
    <div class="stat"><div class="lb">미제출</div><div class="v" id="stMiss">-<small> 명</small></div></div>
  </div>

  <div class="tabs">
    <button id="tabUniv" class="on">대학별 명단</button>
    <button id="tabBan">반별 제출 현황</button>
  </div>

  <div class="fbar" id="fbar" style="display:none"></div>
  <div id="area"></div>

  <div class="foot">호남고등학교 3학년부 · 2027학년도 대입 | 제작 · 호남고 조영신</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* Firestore 백엔드 (상담예약 공용 프로젝트 재사용) */
const firebaseConfig = {
  apiKey: "AIzaSyBotwjsJxit4SbOzXVVOov37Po97AieoxM",
  authDomain: "sangdam-b97c1.firebaseapp.com",
  projectId: "sangdam-b97c1",
  storageBucket: "sangdam-b97c1.firebasestorage.app",
  messagingSenderId: "389048360844",
  appId: "1:389048360844:web:675f4f6ce8d54a873140a9"
};
const FS_COL = "pw_chucheon_students";
const PASS = "honam1234";

const ROSTER = {
 "1": {t:"이지원", s:[[1,"김은찬"],[2,"김청우"],[3,"김하준"],[4,"김현서"],[5,"박예준"],[6,"박태영"],[7,"신이현"],[8,"양하랑"],[9,"윤도현"],[10,"이경엽"],[11,"이은겸"],[12,"이정우"],[13,"이창헌"],[14,"이태희"],[15,"이현호"],[16,"장민준"],[17,"장연범"],[18,"전주형"],[19,"정승재"],[20,"조예찬"],[21,"최성우"]]},
 "2": {t:"신채린", s:[[1,"강민광"],[2,"고의정"],[3,"권현서"],[4,"노승우"],[5,"박민수"],[6,"박지후"],[7,"박철웅"],[8,"백지훈"],[9,"송호준"],[10,"안석현"],[11,"안수현"],[12,"양채완"],[13,"오영현"],[14,"오지우"],[15,"유성민"],[16,"이서우"],[17,"이서진"],[18,"이승로"],[19,"이승주"],[20,"임명찬"],[21,"임현후"]]},
 "3": {t:"류정현", s:[[1,"김균태"],[2,"김민석"],[3,"김성윤"],[4,"김승준"],[5,"김윤호"],[6,"김지환"],[7,"김형민"],[8,"노동완"],[9,"민환"],[10,"박재현"],[11,"박태희"],[12,"손연우"],[13,"신지용"],[14,"안정언"],[15,"안준성"],[16,"이대용"],[17,"이산"],[18,"이성훈"],[19,"이한샘"],[20,"정승욱"],[21,"홍종성"]]},
 "4": {t:"박정민", s:[[1,"강동훈"],[2,"강정우"],[3,"김건우"],[4,"김관유"],[5,"김동윤"],[6,"김민준"],[7,"김세진"],[8,"김영준"],[9,"김현준"],[10,"문관후"],[11,"문준우"],[12,"박윤환"],[13,"박지강"],[14,"유동언"],[15,"유지안"],[16,"이호열"],[17,"한석"],[18,"허정관"]]},
 "5": {t:"심요섭", s:[[1,"강현수"],[2,"김도훈"],[3,"김성빈"],[4,"김예찬"],[5,"서민웅"],[6,"신재민"],[7,"오영일"],[8,"유승범"],[9,"유호성"],[10,"이성빈"],[11,"이승준"],[12,"이승진"],[13,"임태훈"],[14,"장준호"],[15,"전재훈"],[16,"정윤우"],[17,"최예건"],[18,"추민석"],[19,"홍경서"]]},
 "6": {t:"조영신", s:[[1,"강태균"],[2,"김기현"],[3,"김준서"],[4,"김태영"],[5,"박민서"],[6,"박세훈"],[7,"서지완"],[8,"신수한"],[9,"신현민"],[10,"유시형"],[11,"유호준"],[12,"이도윤"],[13,"이준영"],[14,"정승환"],[15,"조승원"],[16,"조원준"],[17,"진현우"],[18,"하승범"]]}
};

const $ = id => document.getElementById(id);
let rows = [], view = "univ", filter = "all", unsub = null;

/* 게이트 */
function tryLogin(){
  if ($("gpw").value === PASS) {
    sessionStorage.setItem("ccAdmin", "1");
    $("gate").style.display = "none"; $("dash").style.display = "block"; load();
  } else { $("gerr").style.display = "block"; $("gpw").select(); }
}
$("gbtn").addEventListener("click", tryLogin);
$("gpw").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
if (sessionStorage.getItem("ccAdmin") === "1") {
  $("gate").style.display = "none"; $("dash").style.display = "block"; load();
}

/* Firestore 실시간 구독 — 학생이 제출하는 즉시 화면에 반영 */
function load(){
  if (unsub) return;
  const db = getFirestore(initializeApp(firebaseConfig));
  unsub = onSnapshot(collection(db, FS_COL), snap => {
    rows = [];
    snap.forEach(d => {
      const v = d.data() || {};
      if (!v.ban || !v.num) return;
      let entries = [];
      try { entries = JSON.parse(v.entriesJson || "[]"); } catch(e){}
      rows.push({ ban:String(v.ban), num:String(v.num), name:v.name || "", ts:v.ts || "",
        none:!!v.none, entries: Array.isArray(entries) ? entries : [] });
    });
    $("live").textContent = "● 실시간 연결됨";
    $("live").style.color = "#7ef0a2";
    render();
  }, err => { $("live").textContent = "연결 오류 — 새로고침 해주세요"; });
}

/* 탭 */
$("tabUniv").addEventListener("click", () => { view = "univ"; syncTabs(); render(); });
$("tabBan").addEventListener("click", () => { view = "ban"; syncTabs(); render(); });
function syncTabs(){
  $("tabUniv").classList.toggle("on", view === "univ");
  $("tabBan").classList.toggle("on", view === "ban");
  $("fbar").style.display = view === "ban" ? "flex" : "none";
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* 대학명 정규화 — "전북대학교"와 "전북대"를 같은 대학으로 묶음 */
function univKey(u){ return String(u).replace(/\s+/g, "").replace(/대학교$/, "대"); }

/* 대학별 그룹: key → { name(짧은 표기), list:[{ban,num,name,major,ts}] } */
function byUniv(){
  const m = new Map();
  for (const r of rows) {
    if (r.none) continue;
    for (const en of r.entries) {
      if (!en.univ) continue;
      const k = univKey(en.univ);
      if (!m.has(k)) m.set(k, { name: en.univ, list: [] });
      const g = m.get(k);
      if (en.univ.length < g.name.length) g.name = en.univ;
      g.list.push({ ban:r.ban, num:r.num, name:r.name, major:en.major || "", ts:r.ts });
    }
  }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, "ko"));
}

function render(){
  /* 통계 */
  const total = Object.values(ROSTER).reduce((a, c) => a + c.s.length, 0);
  const apply = rows.filter(r => !r.none).length;
  const none = rows.filter(r => r.none).length;
  $("stTotal").innerHTML = total + "<small> 명</small>";
  $("stApply").innerHTML = apply + "<small> 명</small>";
  $("stNone").innerHTML = none + "<small> 명</small>";
  $("stMiss").innerHTML = (total - apply - none) + "<small> 명</small>";

  if (view === "univ") renderUniv(); else renderBan();
}

/* ── 대학별 명단 (추천 명단 양식 순서: 대학 → 이름 → 모집단위) ── */
function renderUniv(){
  const groups = byUniv();
  if (!groups.length) {
    $("area").innerHTML = `<div class="empty">아직 제출된 지원 계획이 없습니다. 학생이 제출하면 실시간으로 이곳에 대학별로 정리됩니다.</div>`;
    return;
  }
  $("area").innerHTML = groups.map(g => `
    <div class="card">
      <div class="chd"><span class="tt">${esc(g.name)}</span><span class="n">신청 ${g.list.length}명</span></div>
      <div class="tscroll"><table>
        <thead><tr><th style="width:130px">이름</th><th>모집단위</th><th style="width:110px">반·번호</th><th style="width:100px">제출시각</th></tr></thead>
        <tbody>${g.list.sort((a,b) => a.ban - b.ban || a.num - b.num).map(s => `
          <tr><td><span class="stname">${esc(s.name)}</span></td>
          <td>${esc(s.major)}</td>
          <td class="stnum">${s.ban}반 ${String(s.num).padStart(2,"0")}번</td>
          <td class="ts">${esc(s.ts)}</td></tr>`).join("")}
        </tbody></table></div>
    </div>`).join("");
}

/* ── 반별 제출 현황 ── */
function renderBan(){
  const sub = new Map();
  rows.forEach(r => sub.set(r.ban + "-" + r.num, r));
  const bans = filter === "all" ? Object.keys(ROSTER) : [filter];

  $("fbar").innerHTML = ['<button data-b="all" class="' + (filter==="all"?"on":"") + '">전체</button>']
    .concat(Object.keys(ROSTER).map(b =>
      `<button data-b="${b}" class="${filter===b?"on":""}">${b}반</button>`)).join("");
  $("fbar").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", () => { filter = btn.dataset.b; renderBan(); }));

  let html = "";
  for (const b of bans) {
    const cls = ROSTER[b];
    const submitted = cls.s.filter(([n]) => sub.has(b + "-" + n));
    const missing = cls.s.filter(([n]) => !sub.has(b + "-" + n));

    let tr = "";
    for (const [n, nm] of submitted) {
      const r = sub.get(b + "-" + n);
      const plan = r.none
        ? '<span class="tagnone">지원 계획 없음</span>'
        : r.entries.map(en => `<span class="uline"><b>${esc(en.univ)}</b> — ${esc(en.major)}</span>`).join("");
      tr += `<tr><td><span class="stname">${esc(nm)}</span><br><span class="stnum">${b}반 ${String(n).padStart(2,"0")}번</span></td>
        <td>${plan}</td><td class="ts">${esc(r.ts)}</td></tr>`;
    }
    if (!tr) tr = `<tr><td colspan="3" style="color:#9aa4b1">아직 제출한 학생이 없습니다.</td></tr>`;

    html += `<div class="card">
      <div class="chd"><span class="tt">${b}반 <span style="font-weight:700;font-size:12.5px;color:#cfe0f7">담임 ${cls.t}</span></span>
        <span class="n">제출 ${submitted.length} / ${cls.s.length}명</span></div>
      <div class="tscroll"><table>
        <thead><tr><th style="width:130px">학생</th><th>지원 예정 대학 · 모집단위</th><th style="width:100px">제출시각</th></tr></thead>
        <tbody>${tr}</tbody></table></div>` +
      (missing.length ? `<div class="misslist"><b>미제출 (${missing.length}명)</b><br>` +
        missing.map(([n, nm]) => `<span class="nm">${String(n).padStart(2,"0")} ${esc(nm)}</span>`).join("") + `</div>` : "") +
      `</div>`;
  }
  $("area").innerHTML = html;
}

/* ── 내보내기: 추천 명단 양식 열 순서(대학/이름/모집단위) ── */
function exportRows(){
  const out = [["대학","이름","모집단위","반","번호","제출시각"]];
  for (const g of byUniv())
    for (const s of g.list.sort((a,b) => a.ban - b.ban || a.num - b.num))
      out.push([g.name, s.name, s.major, s.ban, s.num, s.ts]);
  return out;
}

$("csvBtn").addEventListener("click", () => {
  const csv = "\uFEFF" + exportRows().map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.download = "학교장추천_수요조사.csv";
  a.click();
});

$("copyBtn").addEventListener("click", async () => {
  const tsv = exportRows().map(r => r.join("\t")).join("\n");
  try {
    await navigator.clipboard.writeText(tsv);
    $("copyBtn").textContent = "복사 완료 ✓";
    setTimeout(() => $("copyBtn").textContent = "표 복사 (한글·엑셀 붙여넣기)", 1800);
  } catch(e){ alert("복사에 실패했습니다. CSV 다운로드를 이용해 주세요."); }
});
</script>
